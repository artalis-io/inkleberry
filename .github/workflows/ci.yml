name: Inkleberry Finn
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  host:
    name: Host (${{ matrix.os }}, ${{ matrix.cc }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, cc: gcc, cxx: g++}
          - {os: ubuntu-24.04, cc: clang, cxx: clang++}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: make -j2 CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} check install-check
      - name: Verify isolated production build and CUDA provenance
        if: matrix.os == 'ubuntu-24.04' && matrix.cc == 'gcc'
        run: make reference-free-check CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
      - name: Verify extracted production distributions
        if: matrix.os == 'ubuntu-24.04' && matrix.cc == 'gcc'
        run: make release-check install-contract-check CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
      - name: Verify ELF hardening
        if: matrix.os == 'ubuntu-24.04'
        run: make harden-check harden-regression-check CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: make sanitize CXX=clang++
        env:
          ASAN_OPTIONS: detect_leaks=1
      - run: make fuzz-smoke amalgamation-fuzz-smoke FUZZ_RUNS=-1 FUZZ_SECONDS=30
        env:
          ASAN_OPTIONS: detect_leaks=1
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: make lint
# CPU CI is not an inference or GPU qualification gate. Real GPU checks must
# run explicitly on a reserved device; never dispatch untrusted PRs to core-1.

  thread-sanitizer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: make thread-sanitize SAN_CC=clang SAN_CXX=clang++

  windows-native:
    name: Windows (${{ matrix.cc }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        cc: [cl, clang-cl]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Preserve pinned CUDA bytes and deterministic generated sources.
          fetch-depth: 1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          release: false
          install: make
      - name: Native host, ABI, concurrency, mmap and installed consumers
        run: |
          source scripts/msvc-env.sh
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          make -j4 CC=${{ matrix.cc }} PYTHON=python check install-check install-contract-check windows-sdk-check
