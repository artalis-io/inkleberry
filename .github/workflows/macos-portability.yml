name: Optional macOS host portability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portability:
    name: Optional host portability (macos-15, clang)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: make -j2 CC=clang CXX=clang++ check install-check
# Host-only portability evidence. This workflow never qualifies CUDA execution
# and is deliberately absent from PR/push triggers and required merge checks.
